<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shopping List — Grocify</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛒</text></svg>" />
</head>
<body>
  <div id="nav"></div>
  <div class="container">
    <h2 class="page-title">Shopping List</h2>

    <div class="card">
      <div class="card-head">
        <h3>➕ Add to list</h3>
        <button class="btn btn-sm btn-primary" id="suggestBtn">✨ Auto-suggest</button>
      </div>
      <div id="message" class="alert alert-info hidden"></div>
      <form class="shopping-form" id="shoppingForm">
        <input id="name" placeholder="Item name" required />
        <input id="quantity" type="number" min="0" step="1" placeholder="Qty" value="1" />
        <select id="unit"></select>
        <button class="btn btn-primary" type="submit">Add</button>
      </form>
    </div>

    <div class="card">
      <h3 id="pendingTitle">To Buy</h3>
      <div id="pendingList"><p class="muted">Loading...</p></div>
    </div>

    <div class="card hidden" id="doneCard">
      <h3 id="doneTitle">Purchased</h3>
      <div id="doneList"></div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/units.js"></script>
  <script src="js/shopping.js"></script>
</body>
</html>
